<!-- START EMAIL SIGNATURE -->
<table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse; font-family: Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.4; color: #333333; max-width: 600px;">
  <tr>
    <td style="padding: 0; vertical-align: top;">
      <!-- Logo/Image Section (Optional - degrades gracefully if blocked) -->
      <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
        <tr>
          <td style="padding: 0 0 8px 0;">
            <!-- Replace with your logo URL and alt text -->
            <img src="https://img.icons8.com/fluency/96/000000/company.png" alt="Company Logo" width="150" height="40" style="display: block; border: 0; max-width: 150px; height: auto;" />
          </td>
        </tr>
      </table>
      
      <!-- Contact Information Section -->
      <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
        <tr>
          <td style="padding: 0;">
            <!-- Name -->
            <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 0 0 4px 0; font-size: 15px; font-weight: bold; color: #0066CC; line-height: 1.3;">
                  [Your Name]
                </td>
              </tr>
            </table>
            
            <!-- Title -->
            <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 0 0 8px 0; font-size: 12px; color: #666666; line-height: 1.3;">
                  [Your Job Title]
                </td>
              </tr>
            </table>
            
            <!-- Company Name -->
            <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 0 0 8px 0; font-size: 12px; font-weight: bold; color: #333333; line-height: 1.3;">
                  [Company Name]
                </td>
              </tr>
            </table>
            
            <!-- Contact Details -->
            <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 0;">
                  <!-- Phone -->
                  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                    <tr>
                      <td style="padding: 0 0 4px 0; font-size: 12px; color: #333333; line-height: 1.5;">
                        <span style="color: #666666;">Phone:</span> 
                        <a href="tel:+1234567890" style="color: #0066CC; text-decoration: none;">[Phone Number]</a>
                      </td>
                    </tr>
                  </table>
                  
                  <!-- Email -->
                  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                    <tr>
                      <td style="padding: 0 0 4px 0; font-size: 12px; color: #333333; line-height: 1.5;">
                        <span style="color: #666666;">Email:</span> 
                        <a href="mailto:your.email@company.com" style="color: #0066CC; text-decoration: none;">[your.email@company.com]</a>
                      </td>
                    </tr>
                  </table>
                  
                  <!-- Website -->
                  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                    <tr>
                      <td style="padding: 0 0 4px 0; font-size: 12px; color: #333333; line-height: 1.5;">
                        <span style="color: #666666;">Web:</span> 
                        <a href="https://www.company.com" target="_blank" style="color: #0066CC; text-decoration: none;">[www.company.com]</a>
                      </td>
                    </tr>
                  </table>
                  
                  <!-- Address (if needed) -->
                  <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
                    <tr>
                      <td style="padding: 0 0 4px 0; font-size: 12px; color: #333333; line-height: 1.5;">
                        <span style="color: #666666;">Address:</span> 
                        [Street Address, City, State ZIP]
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>
            
            <!-- Social Media Icons (Optional - degrades gracefully) -->
            <table border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
              <tr>
                <td style="padding: 10px 0 0 0;">
                  <!-- LinkedIn -->
                  <a href="https://www.linkedin.com/in/yourprofile" target="_blank" style="text-decoration: none; display: inline-block; margin-right: 8px;">
                    <img src="https://img.icons8.com/color/48/000000/linkedin.png" alt="LinkedIn" width="20" height="20" style="display: block; border: 0; max-width: 20px; height: auto;" />
                  </a>
                  <!-- Twitter/X -->
                  <a href="https://twitter.com/yourhandle" target="_blank" style="text-decoration: none; display: inline-block; margin-right: 8px;">
                    <img src="https://img.icons8.com/color/48/000000/twitter--v1.png" alt="Twitter/X" width="20" height="20" style="display: block; border: 0; max-width: 20px; height: auto;" />
                  </a>
                  <!-- Facebook -->
                  <a href="https://www.facebook.com/yourprofile" target="_blank" style="text-decoration: none; display: inline-block; margin-right: 8px;">
                    <img src="https://img.icons8.com/color/48/000000/facebook.png" alt="Facebook" width="20" height="20" style="display: block; border: 0; max-width: 20px; height: auto;" />
                  </a>
                  <!-- Instagram -->
                  <a href="https://www.instagram.com/yourhandle" target="_blank" style="text-decoration: none; display: inline-block; margin-right: 8px;">
                    <img src="https://img.icons8.com/color/48/000000/instagram-new.png" alt="Instagram" width="20" height="20" style="display: block; border: 0; max-width: 20px; height: auto;" />
                  </a>
                  <!-- Add more social icons as needed -->
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
<!-- END EMAIL SIGNATURE -->
